        // PRNG Implementation (Mulberry32)
        // A fast, high-quality pseudo-random number generator
        // Reference: https://github.com/bryc/code/blob/master/jshash/PRNGs.md
        function createPRNG(seed) {
            let state = hashString(seed);
            
            return function() {
                // Magic constants are part of the Mulberry32 algorithm for good distribution
                state = (state + 0x6D2B79F5) | 0;
                let t = Math.imul(state ^ (state >>> 15), 1 | state);
                t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
        }

        // Hash string to number for seed
        function hashString(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                const char = str.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
            }
            return hash >>> 0;
        }

        // Fisher-Yates Shuffle with PRNG
        function shuffleArray(array, random) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;

        // Draw cards function
        function drawCards() {
            const errorDiv = document.getElementById('errorMessage');
            const seedDisplay = document.getElementById('seedDisplay');
            const resultsDiv = document.getElementById('results');
            
            // Clear previous results and errors
            errorDiv.classList.add('hidden');
            seedDisplay.classList.add('hidden');
            resultsDiv.innerHTML = '';
            
            // Get inputs
            const drawCount = parseInt(document.getElementById('drawCount').value);
            let seed = document.getElementById('seed').value.trim();
            
            // Validation
            if (isNaN(drawCount) || drawCount < 1 || drawCount > 78) {
                showError('抽牌數量必須在 1 到 78 之間');
                return;
            }
            
            // Generate seed if not provided
            if (!seed) {
                seed = Date.now().toString() + Math.random().toString();
            }
            
            // Display seed (using textContent to prevent XSS)
            seedDisplay.innerHTML = '<strong>🔑 Seed（可複現種子）：</strong>';
            const seedText = document.createTextNode(seed);
            seedDisplay.appendChild(seedText);
            seedDisplay.classList.remove('hidden');
            
            // Create PRNG
            const random = createPRNG(seed);
            
            // Shuffle deck
            const shuffledDeck = shuffleArray(tarotDeck, random);
            
            // Draw cards
            const drawnCards = shuffledDeck.slice(0, drawCount);
            
            // Determine orientation for each card
            const results = drawnCards.map(card => {
                const isUpright = random() > 0.5;
                return {
                    ...card,
                    orientation: isUpright ? 'upright' : 'reversed'
                };
            });
            
            // Display results
            displayResults(results);
        }

        function displayResults(cards) {
            const resultsDiv = document.getElementById('results');
            
            cards.forEach((card, index) => {
                const cardDiv = document.createElement('div');
                cardDiv.className = 'card';
                cardDiv.setAttribute('role', 'article');
                cardDiv.setAttribute('aria-label', `第 ${index + 1} 張牌`);
                
                const isUpright = card.orientation === 'upright';
                const orientationText = isUpright ? '正位' : '逆位';
                const orientationClass = isUpright ? 'upright' : 'reversed';
                const description = isUpright ? card.upright : card.reversed;
                
                cardDiv.innerHTML = `
                    <div class="card-header">
                        <div class="card-name">${card.name}</div>
                        <div class="card-orientation ${orientationClass}">${orientationText}</div>
                    </div>
                    <div class="card-keywords">
                        <strong>關鍵詞：</strong>${card.keywords}
                    </div>
                    <div class="card-description">
                        ${description}
                    </div>
                    <div class="card-advice">
                        <strong>💡 建議：</strong>${card.advice}
                    </div>
                `;
                
                resultsDiv.appendChild(cardDiv);
            });
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.classList.remove('hidden');
        }

        function resetForm() {
            document.getElementById('drawCount').value = '3';
            document.getElementById('seed').value = '';
            document.getElementById('errorMessage').classList.add('hidden');
            document.getElementById('seedDisplay').classList.add('hidden');
            document.getElementById('results').innerHTML = '';
        }

        // Keyboard support
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && (e.target.id === 'drawCount' || e.target.id === 'seed')) {
                drawCards();
            }
        });
